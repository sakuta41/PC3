<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goku Super Saiyan - Animación CSS Pure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #05050d;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* =========================================================
       ANIMACIONES CSS GENERALES Y EFECTOS DE PODER (KI)
       ========================================================= */

    /* Vibración / Temblores de pantalla por energía */
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-2px, -3px) rotate(-0.5deg); }
      20% { transform: translate(3px, 2px) rotate(0.5deg); }
      30% { transform: translate(-3px, 1px) rotate(-0.2deg); }
      40% { transform: translate(2px, -2px) rotate(0.3deg); }
      50% { transform: translate(-1px, 3px) rotate(-0.5deg); }
      60% { transform: translate(3px, 1px) rotate(0.2deg); }
      70% { transform: translate(-2px, -1px) rotate(-0.3deg); }
      80% { transform: translate(2px, 2px) rotate(0.4deg); }
      90% { transform: translate(-1px, -2px) rotate(-0.2deg); }
    }

    .animate-shake {
      animation: screenShake 0.4s infinite ease-in-out;
    }

    /* Aura Principal de Super Saiyan */
    @keyframes auraPulsate {
      0% {
        transform: scale(0.96) rotate(-2deg);
        opacity: 0.8;
        filter: blur(12px) drop-shadow(0 0 35px #facc15);
      }
      50% {
        transform: scale(1.08) rotate(2deg);
        opacity: 1;
        filter: blur(18px) drop-shadow(0 0 60px #eab308) drop-shadow(0 0 90px #f97316);
      }
      100% {
        transform: scale(0.96) rotate(-2deg);
        opacity: 0.8;
        filter: blur(12px) drop-shadow(0 0 35px #facc15);
      }
    }

    .aura-flames {
      animation: auraPulsate 0.8s infinite ease-in-out;
      background: radial-gradient(circle at 50% 80%, #fef08a 0%, #facc15 35%, #f97316 70%, transparent 100%);
      border-radius: 40% 40% 20% 20% / 60% 60% 30% 30%;
    }

    /* Olas de energía que ascienden */
    @keyframes riseWaves {
      0% {
        transform: translateY(60px) scaleX(0.8) scaleY(0.5);
        opacity: 0;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-140px) scaleX(1.4) scaleY(1.3);
        opacity: 0;
      }
    }

    .energy-wave-1 {
      animation: riseWaves 1.2s infinite cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }
    .energy-wave-2 {
      animation: riseWaves 1.2s infinite 0.4s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }
    .energy-wave-3 {
      animation: riseWaves 1.2s infinite 0.8s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }

    /* Descargas Eléctricas SSJ2/SSJ Power Up */
    @keyframes lightningFlash {
      0%, 100% { opacity: 0; transform: scale(0.7) rotate(0deg); }
      12% { opacity: 1; transform: scale(1.1) rotate(15deg); }
      24% { opacity: 0; transform: scale(0.9) rotate(-10deg); }
      60% { opacity: 0; transform: scale(0.8) rotate(45deg); }
      65% { opacity: 1; transform: scale(1.2) rotate(-25deg); }
      70% { opacity: 0; transform: scale(0.7) rotate(10deg); }
    }

    .lightning-bolt {
      animation: lightningFlash 1.5s infinite ease-in-out;
    }

    /* Partículas de Ki Flotantes */
    @keyframes floatParticle {
      0% {
        transform: translateY(120px) scale(0.2);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-220px) scale(1.2);
        opacity: 0;
      }
    }

    /* Respingo del personaje al cargar poder */
    @keyframes gokuPowerFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .goku-body-float {
      animation: gokuPowerFloat 1.2s infinite ease-in-out;
    }

    /* Ojos brillantes */
    @keyframes eyeGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #22d3ee); }
      50% { filter: drop-shadow(0 0 8px #06b6d4) drop-shadow(0 0 12px #67e8f9); }
    }

    .eyes-cyan {
      animation: eyeGlow 0.8s infinite alternate;
    }

    /* Movimiento del Cabello Super Saiyan */
    @keyframes hairSway {
      0%, 100% { transform: scaleY(1) rotate(0deg); }
      50% { transform: scaleY(1.05) rotate(1.5deg) translateY(-2px); }
    }

    .spiky-hair {
      animation: hairSway 0.3s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-4 bg-gradient-to-b from-slate-950 via-slate-900 to-amber-950/40">

  <!-- RESPLANDOR DE FONDO -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-amber-500/20 via-transparent to-transparent pointer-events-none"></div>

  <!-- ENCABEZADO TITULO -->
  <header class="text-center z-20 mb-4 sm:mb-8">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold uppercase tracking-widest mb-2 shadow-lg shadow-amber-500/10">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
      Animación CSS Pura • Autoejecutable
    </div>
    <h1 class="text-3xl sm:text-5xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 drop-shadow-[0_4px_12px_rgba(245,158,11,0.4)]">
      GOKU SUPER SAIYAN
    </h1>
    <p class="text-slate-400 text-xs sm:text-sm mt-1 max-w-md mx-auto">
      Carga ininterrumpida de Ki con formas CSS geométricas, degradados y partículas animadas.
    </p>
  </header>

  <!-- CONTENEDOR PRINCIPAL DEL PERSONAJE Y ESCENA -->
  <div class="relative w-full max-w-md h-[460px] sm:h-[500px] flex items-center justify-center z-10 animate-shake">

    <!-- SUELO / CRÁTER DE ENERGÍA -->
    <div class="absolute bottom-6 w-72 h-12 bg-amber-500/20 rounded-[100%] blur-md border-2 border-amber-400/40 transform scale-y-50"></div>
    <div class="absolute bottom-4 w-96 h-16 bg-orange-600/15 rounded-[100%] blur-xl transform scale-y-50"></div>

    <!-- AURA DE KI SUPER SAIYAN (CAPAS DE ENERGÍA) -->
    <div class="absolute w-72 sm:w-80 h-96 sm:h-[400px] aura-flames bottom-12 z-0"></div>

    <!-- OLAS DE KI ASCENDENTES (WAVES) -->
    <div class="absolute bottom-10 w-64 h-80 rounded-full border-4 border-yellow-300/60 energy-wave-1 blur-sm z-0"></div>
    <div class="absolute bottom-10 w-72 h-80 rounded-full border-4 border-amber-400/50 energy-wave-2 blur-sm z-0"></div>
    <div class="absolute bottom-10 w-80 h-80 rounded-full border-4 border-orange-500/40 energy-wave-3 blur-md z-0"></div>

    <!-- RAYOS Y DESCARGAS ELÉCTRICAS -->
    <div class="absolute w-80 h-80 lightning-bolt pointer-events-none z-20">
      <svg viewBox="0 0 200 200" class="w-full h-full stroke-cyan-300 fill-none drop-shadow-[0_0_8px_#22d3ee]">
        <path d="M 30 100 L 50 80 L 45 95 L 70 70" stroke-width="3" stroke-linecap="round"/>
        <path d="M 170 110 L 145 90 L 155 105 L 130 80" stroke-width="3" stroke-linecap="round"/>
        <path d="M 100 30 L 115 50 L 105 55 L 125 75" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- PARTÍCULAS DE KI ELEVÁNDOSE (GENERADAS CON CSS) -->
    <div class="absolute inset-0 pointer-events-none z-20 overflow-hidden">
      <div class="absolute left-1/4 bottom-10 w-2.5 h-2.5 bg-yellow-200 rounded-full shadow-[0_0_8px_#fef08a]" style="animation: floatParticle 1.4s infinite 0.1s ease-in;"></div>
      <div class="absolute left-1/3 bottom-12 w-3 h-3 bg-amber-300 rounded-full shadow-[0_0_10px_#fde047]" style="animation: floatParticle 1.1s infinite 0.5s ease-in;"></div>
      <div class="absolute right-1/4 bottom-10 w-2 h-2 bg-yellow-100 rounded-full shadow-[0_0_6px_#fef08a]" style="animation: floatParticle 1.6s infinite 0.3s ease-in;"></div>
      <div class="absolute right-1/3 bottom-16 w-3.5 h-3.5 bg-orange-300 rounded-full shadow-[0_0_12px_#fdba74]" style="animation: floatParticle 1.3s infinite 0.8s ease-in;"></div>
      <div class="absolute left-1/2 bottom-8 w-2 h-2 bg-cyan-200 rounded-full shadow-[0_0_8px_#a5f3fc]" style="animation: floatParticle 0.9s infinite 0.4s ease-in;"></div>
    </div>

    <!-- =========================================================
       CUERPO Y CABEZA DE GOKU EN CSS
       ========================================================= -->
    <div class="relative z-10 goku-body-float flex flex-col items-center top-4">

      <!-- CABELLO SUPER SAIYAN (ERIZADO Y DORADO) -->
      <div class="relative w-44 h-32 spiky-hair -mb-9 z-20">
        <!-- Mechón Central Principal -->
        <div class="absolute left-1/2 -translate-x-1/2 top-0 w-12 h-28 bg-gradient-to-t from-amber-400 via-yellow-300 to-yellow-100 rounded-t-full transform -rotate-6 shadow-[inset_4px_0_8px_rgba(217,119,6,0.5)]" style="clip-path: polygon(50% 0%, 100% 100%, 0% 100%);"></div>
        
        <!-- Mechones Izquierdos -->
        <div class="absolute left-8 top-3 w-11 h-24 bg-gradient-to-t from-amber-500 via-yellow-300 to-yellow-100 rounded-t-full transform -rotate-45" style="clip-path: polygon(30% 0%, 100% 100%, 0% 100%);"></div>
        <div class="absolute left-2 top-8 w-12 h-20 bg-gradient-to-t from-amber-500 via-yellow-400 to-yellow-200 rounded-t-full transform -rotate-65" style="clip-path: polygon(20% 0%, 100% 100%, 0% 100%);"></div>
        <div class="absolute left-0 top-14 w-10 h-16 bg-gradient-to-t from-amber-600 via-yellow-400 to-yellow-200 rounded-t-full transform -rotate-[80deg]" style="clip-path: polygon(0% 0%, 100% 100%, 0% 100%);"></div>

        <!-- Mechones Derechos -->
        <div class="absolute right-8 top-3 w-11 h-24 bg-gradient-to-t from-amber-500 via-yellow-300 to-yellow-100 rounded-t-full transform rotate-45" style="clip-path: polygon(70% 0%, 100% 100%, 0% 100%);"></div>
        <div class="absolute right-2 top-8 w-12 h-20 bg-gradient-to-t from-amber-500 via-yellow-400 to-yellow-200 rounded-t-full transform rotate-65" style="clip-path: polygon(80% 0%, 100% 100%, 0% 100%);"></div>
        <div class="absolute right-0 top-14 w-10 h-16 bg-gradient-to-t from-amber-600 via-yellow-400 to-yellow-200 rounded-t-full transform rotate-[80deg]" style="clip-path: polygon(100% 0%, 100% 100%, 0% 100%);"></div>

        <!-- Mechones de Frente / Flequillo SSJ -->
        <div class="absolute left-12 top-12 w-7 h-14 bg-yellow-200 transform rotate-25 rounded-b-full z-30 border-r border-amber-500/40"></div>
        <div class="absolute right-12 top-12 w-7 h-14 bg-yellow-200 transform -rotate-25 rounded-b-full z-30 border-l border-amber-500/40"></div>
      </div>

      <!-- ROSTRO DE GOKU -->
      <div class="relative w-24 h-24 bg-gradient-to-b from-[#f7d0b3] via-[#e2ab86] to-[#c98a63] rounded-b-[40%] rounded-t-[20%] border-b-2 border-[#a3633e] flex flex-col items-center justify-center z-10 shadow-md">
        
        <!-- CEJAS SUPER SAIYAN (DORADAS Y MOLESTAS/GRITANDO) -->
        <div class="flex justify-between w-16 -mt-2 z-10">
          <div class="w-7 h-2.5 bg-yellow-400 transform rotate-12 border-b-2 border-amber-600 rounded-sm"></div>
          <div class="w-7 h-2.5 bg-yellow-400 transform -rotate-12 border-b-2 border-amber-600 rounded-sm"></div>
        </div>

        <!-- OJOS CYAN/AZUL SAIYAN -->
        <div class="flex justify-between w-14 mt-0.5 eyes-cyan z-10">
          <div class="w-4 h-3 bg-cyan-300 border-2 border-slate-900 rounded-xs flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-slate-950 rounded-full"></div>
          </div>
          <div class="w-4 h-3 bg-cyan-300 border-2 border-slate-900 rounded-xs flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-slate-950 rounded-full"></div>
          </div>
        </div>

        <!-- NARIZ -->
        <div class="w-1.5 h-2 border-r-2 border-b-2 border-[#94512e] transform rotate-45 my-0.5"></div>

        <!-- BOCA GRITANDO (CHARGE POWER) -->
        <div class="w-7 h-5 bg-amber-950 border-2 border-[#834222] rounded-b-full overflow-hidden flex flex-col items-center justify-between p-0.5 shadow-inner">
          <div class="w-5 h-1.5 bg-white rounded-sm"></div> <!-- Dientes -->
          <div class="w-4 h-2 bg-red-600 rounded-t-full"></div> <!-- Lengua -->
        </div>

        <!-- OREJAS -->
        <div class="absolute -left-3 top-7 w-3.5 h-6 bg-[#e2ab86] rounded-l-full border-l border-amber-800/40"></div>
        <div class="absolute -right-3 top-7 w-3.5 h-6 bg-[#e2ab86] rounded-r-full border-r border-amber-800/40"></div>
      </div>

      <!-- CUELLO Y MÚSCULOS SUPERIORES -->
      <div class="w-10 h-6 bg-[#d69871] border-x-2 border-[#a3633e] -mt-2 z-0"></div>

      <!-- TORSO Y TRAJE ORANGE / GI (DOGI DE ENTRENAMIENTO) -->
      <div class="relative w-36 h-28 bg-gradient-to-b from-orange-600 via-orange-500 to-orange-700 rounded-t-3xl border-t-2 border-orange-400 flex justify-center overflow-hidden shadow-2xl">
        
        <!-- Camiseta Interior Azul (Undershirt) -->
        <div class="w-16 h-12 bg-indigo-900 rounded-b-full border-b-2 border-indigo-950 flex justify-center pt-1">
          <!-- Pecho muscular visible -->
          <div class="w-10 h-6 bg-[#e2ab86] rounded-b-lg border-b border-[#a3633e]"></div>
        </div>

        <!-- Solapas del Traje Naranja (Doblez Gi) -->
        <div class="absolute left-0 top-0 w-12 h-20 bg-orange-600 transform -rotate-12 border-r-2 border-orange-800"></div>
        <div class="absolute right-0 top-0 w-12 h-20 bg-orange-600 transform rotate-12 border-l-2 border-orange-800"></div>

        <!-- CINTURÓN AZUL (OBI) -->
        <div class="absolute bottom-0 w-full h-6 bg-indigo-950 border-t-2 border-indigo-700 flex items-center justify-center">
          <div class="w-4 h-8 bg-indigo-900 border border-indigo-950 transform rotate-12 absolute left-14 top-1"></div>
        </div>
      </div>

      <!-- BRAZOS MUSCULOSOS EN TENSIÓN (CARGANDO KI) -->
      <!-- Brazo Izquierdo -->
      <div class="absolute -left-10 top-24 w-12 h-24 bg-[#e2ab86] rounded-full border-2 border-[#94512e] transform -rotate-25 flex flex-col items-center justify-end p-1 shadow-lg">
        <div class="w-8 h-8 bg-indigo-900 rounded-full border border-indigo-950 mb-1"></div> <!-- Muñequera Azul -->
        <div class="w-7 h-7 bg-[#d69871] rounded-full border border-[#94512e]"></div> <!-- Puño -->
      </div>
      
      <!-- Brazo Derecho -->
      <div class="absolute -right-10 top-24 w-12 h-24 bg-[#e2ab86] rounded-full border-2 border-[#94512e] transform rotate-25 flex flex-col items-center justify-end p-1 shadow-lg">
        <div class="w-8 h-8 bg-indigo-900 rounded-full border border-indigo-950 mb-1"></div> <!-- Muñequera Azul -->
        <div class="w-7 h-7 bg-[#d69871] rounded-full border border-[#94512e]"></div> <!-- Puño -->
      </div>

    </div>
  </div>

  <!-- ESTADÍSTICAS Y PANEL INFORMATIVO -->
  <footer class="z-20 mt-4 text-center">
    <div class="inline-flex items-center gap-6 px-6 py-3 rounded-2xl bg-slate-900/80 border border-slate-800/80 backdrop-blur-md shadow-2xl">
      <div class="text-left">
        <span class="block text-[10px] uppercase font-bold text-slate-400">Nivel de Ki</span>
        <span class="text-sm font-bold font-orbitron text-amber-400 animate-pulse">150,000,000 +</span>
      </div>
      <div class="h-6 w-px bg-slate-800"></div>
      <div class="text-left">
        <span class="block text-[10px] uppercase font-bold text-slate-400">Estado</span>
        <span class="text-sm font-bold font-orbitron text-yellow-300">Super Saiyan</span>
      </div>
    </div>
  </footer>

</body>
</html>
